<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Kotonoha — 言の葉</title>
  <defs>
    <filter id="logoCardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e4e00" flood-opacity="0.28" />
    </filter>
    <linearGradient id="logoFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ed802" />
      <stop offset="100%" stop-color="#50be00" />
    </linearGradient>
    <linearGradient id="logoGoldSpark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe266" />
      <stop offset="100%" stop-color="#ffb800" />
    </linearGradient>
    <linearGradient id="logoMouthDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46a800" />
      <stop offset="100%" stop-color="#50be00" />
    </linearGradient>
  </defs>

  <!-- Símbolo da Marca: Squircle Tátil 3D com Folha de Bambu + 言 + Spark -->
  <g transform="translate(42, 16) scale(0.875)">
    <!-- Base 3D elevation -->
    <rect x="16" y="26" width="224" height="214" rx="52" fill="#357300" filter="url(#logoCardShadow)" />
    
    <!-- Face vibrante tátil -->
    <rect x="16" y="16" width="224" height="212" rx="52" fill="url(#logoFaceGrad)" />
    <rect x="17" y="17" width="222" height="210" rx="51" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- Glifo interno -->
    <circle cx="138" cy="35" r="6.5" fill="url(#logoGoldSpark)" />

    <path d="M 72 36
             C 86 34, 102 42, 108 53
             C 96 56, 82 50, 72 36 Z" 
          fill="#ffffff" />
    
    <path d="M 68 56
             C 80 54, 98 56, 106 61
             C 94 65, 78 66, 68 56 Z" 
          fill="#ffffff" />

    <rect x="100" y="49" width="62" height="15" rx="7.5" fill="#ffffff" />
    <rect x="66" y="80" width="124" height="15" rx="7.5" fill="#ffffff" />
    <rect x="84" y="108" width="88" height="14" rx="7" fill="#ffffff" />
    <rect x="84" y="134" width="88" height="14" rx="7" fill="#ffffff" />
    <rect x="80" y="160" width="96" height="46" rx="11" fill="#ffffff" />
    <rect x="96" y="172" width="64" height="22" rx="6" fill="url(#logoMouthDepth)" />
  </g>

  <!-- Tipografia Principal "Kotonoha" (Vectorizada para máxima nitidez e fidelidade) -->
  <g transform="translate(280, 74) scale(1.16)">
    <g fill="#162019" fill-rule="evenodd">
      <!-- K -->
      <path transform="translate(0 0)" d="M0 0H12V34L46 0H62L23 39L64 80H47L12 45V80H0Z"/>
      <!-- o -->
      <path transform="translate(75 0)" d="M28 18C46 18 56 30 56 50C56 70 46 82 28 82C10 82 0 70 0 50C0 30 10 18 28 18ZM28 29C17 29 12 37 12 50C12 63 17 71 28 71C39 71 44 63 44 50C44 37 39 29 28 29Z"/>
      <!-- t -->
      <path transform="translate(145 0)" d="M10 4H22V20H39V31H22V60C22 68 25 71 32 71H39V82H31C17 82 10 75 10 60V31H0V20H10Z"/>
      <!-- o -->
      <path transform="translate(198 0)" d="M28 18C46 18 56 30 56 50C56 70 46 82 28 82C10 82 0 70 0 50C0 30 10 18 28 18ZM28 29C17 29 12 37 12 50C12 63 17 71 28 71C39 71 44 63 44 50C44 37 39 29 28 29Z"/>
      <!-- n -->
      <path transform="translate(269 0)" d="M0 20H12V27C17 21 24 18 32 18C48 18 56 28 56 46V80H44V47C44 35 39 29 30 29C19 29 12 37 12 48V80H0Z"/>
      <!-- o -->
      <path transform="translate(340 0)" d="M28 18C46 18 56 30 56 50C56 70 46 82 28 82C10 82 0 70 0 50C0 30 10 18 28 18ZM28 29C17 29 12 37 12 50C12 63 17 71 28 71C39 71 44 63 44 50C44 37 39 29 28 29Z"/>
      <!-- h -->
      <path transform="translate(411 0)" d="M0 0H12V27C17 21 24 18 32 18C48 18 56 28 56 46V80H44V47C44 35 39 29 30 29C19 29 12 37 12 48V80H0Z"/>
      <!-- a -->
      <path transform="translate(482 0)" d="M28 18C35 18 41 21 45 26V20H57V80H45V74C41 79 35 82 28 82C10 82 0 70 0 50C0 30 10 18 28 18ZM28 29C17 29 12 37 12 50C12 63 17 71 28 71C39 71 45 63 45 50C45 37 39 29 28 29Z"/>
    </g>
  </g>

  <!-- Carimbo Kanji e Subtítulo Autêntico: 言の葉 (Kotonoha) em Ouro Kokoro -->
  <g transform="translate(906, 122)">
    <rect x="-14" y="-38" width="28" height="66" rx="4" fill="none" stroke="#e5a800" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="-18" font-family="'M PLUS Rounded 1c', 'Yu Mincho', 'Hiragino Mincho ProN', serif" font-size="16" font-weight="700" fill="#d99b00" text-anchor="middle">言</text>
    <text x="0" y="1" font-family="'M PLUS Rounded 1c', 'Yu Mincho', 'Hiragino Mincho ProN', serif" font-size="14" font-weight="700" fill="#d99b00" text-anchor="middle">の</text>
    <text x="0" y="20" font-family="'M PLUS Rounded 1c', 'Yu Mincho', 'Hiragino Mincho ProN', serif" font-size="16" font-weight="700" fill="#d99b00" text-anchor="middle">葉</text>
  </g>
</svg>
